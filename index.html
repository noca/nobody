<title>nobody</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;

  .container { max-width: 500px; width: 100%; text-align: center; }

    background: #1a5c2a; border-radius: 50%;
